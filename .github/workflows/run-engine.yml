name: Run Story Engine

on:
  workflow_dispatch: # Tombol manual di tab Actions GitHub
  schedule:
    - cron: "0 0,6,12,18 * * *" # Otomatis berjalan 4 kali sehari

permissions:
  contents: write

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engine Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/main.py

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          localFilePath: episode_*.docx
          uploadMethod: media

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.node.email"
          git add data/story.json
          git diff --staged --quiet || git commit -m "Auto-generate new episode & docx via Story Engine [skip ci]"
          git push
